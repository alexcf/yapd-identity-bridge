# Merge into your existing YAPD Compose project after building the patched image.
services:
  yapd:
    image: yapd:identity
    environment:
      YAPD_IDENTITY_FILE: /var/lib/yapd-identity/inventory.json
    volumes:
      - ./state:/var/lib/yapd-identity:ro
  identity:
    build: .
    restart: unless-stopped
    user: '${PUID:-1000}:${PGID:-1000}'
    env_file: .env
    volumes:
      - ./state:/var/lib/yapd-identity
      - ./secrets:/run/secrets:ro
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '2'}
